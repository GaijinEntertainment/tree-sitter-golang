[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { name = "Gaijin Entertainment" }, { email = "xog3@yandex.ru", name = "Anton Zinovyev" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "Go grammar for tree-sitter"
keywords = [ "incremental", "parsing", "tree-sitter", "golang" ]
license.text = "MIT"
name = "tree-sitter-golang"
readme = "README.md"
requires-python = ">=3.10"
version = "1.27.0"

[project.urls]
Homepage = "https://github.com/GaijinEntertainment/tree-sitter-golang"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
