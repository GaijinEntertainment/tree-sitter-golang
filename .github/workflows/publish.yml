name: Publish packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  github:
    uses: tree-sitter/workflows/.github/workflows/release.yml@10c66d66e558b37df92e2a8ec5321218a6547b04
    permissions:
      contents: write
      id-token: write
      attestations: write

  crates:
    name: Publish Rust package
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/tree-sitter-golang
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{steps.auth.outputs.token}}

  python-sdist:
    name: Build Python source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install --upgrade build
      - name: Build source distribution
        run: python -m build --sdist
      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 2

  python-wheels:
    name: Build Python wheels on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os:
          - windows-2025
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: native
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{matrix.os}}
          path: dist/*.whl
          retention-days: 2

  pypi:
    name: Publish Python package
    needs: [python-sdist, python-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tree-sitter-golang/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
